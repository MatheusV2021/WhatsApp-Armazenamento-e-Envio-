<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Contato</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
</head>
<body>
  <div class="container">
    <div class="text">
      Formulário de Contato
    </div>
    <form action="#">
      <div class="form-row">
        <div class="input-data">
          <input type="text" id="nome" required>
          <div class="underline"></div>
          <label for="">Nome</label>
        </div>
        <div class="input-data">
          <input type="text" id="endereco" required>
          <div class="underline"></div>
          <label for="">Endereço</label>
        </div>
      </div>
      <div class="form-row">
        <div class="input-data">
          <input type="email" id="email" required>
          <div class="underline"></div>
          <label for="">E-mail</label>
        </div>
        <div class="input-data">
          <input type="tel" id="telefone" required>
          <div class="underline"></div>
          <label for="">Telefone</label>
        </div>
      </div>
      <div class="form-row">
        <div class="input-data">
          <input type="tel" id="whatsapp">
          <div class="underline"></div>
          <label for="">WhatsApp (para envio)</label>
        </div>
        <div class="input-data">
          <input type="text" style="visibility: hidden;">
        </div>
      </div>
      
      <div class="action-buttons">
        <div class="action-btn">
          <div class="inner"></div>
          <button type="button" id="gravar"><i class="fas fa-save"></i> Gravar</button>
        </div>
        <div class="action-btn">
          <div class="inner"></div>
          <button type="button" id="exibir"><i class="fas fa-eye"></i> Exibir</button>
        </div>
        <div class="action-btn">
          <div class="inner"></div>
          <button type="button" id="enviar"><i class="fab fa-whatsapp"></i> Enviar</button>
        </div>
      </div>
    </form>
    
    <div id="dataDisplay" class="data-display hidden">
      <h3>DADOS ARMAZENADOS</h3>
      <div id="displayContent"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
